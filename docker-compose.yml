services:
  redis:
    image: redis:7-alpine
    container_name: tempolink-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --notify-keyspace-events
      - Ex
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
